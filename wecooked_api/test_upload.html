<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .upload-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        button {
            background: #667eea;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #preview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px 0;
            display: none;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            display: none;
        }
        #loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plant Analyzer</h1>
        
        <div class="upload-section">
            <p>Select an image to analyze:</p>
            <input type="file" id="imageInput" accept="image/*">
            <br>
            <img id="preview" alt="Preview">
            <br>
            <button id="analyzeBtn" onclick="analyzeImage()" disabled>Analyze Image</button>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p>Analyzing image...</p>
        </div>

        <div id="result">
            <h3>Results:</h3>
            <pre id="resultText"></pre>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultText = document.getElementById('resultText');

        // Show preview when file is selected
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    analyzeBtn.disabled = false;
                }
                reader.readAsDataURL(file);
            }
        });

        async function analyzeImage() {
            const file = imageInput.files[0];
            if (!file) {
                alert('Please select an image first!');
                return;
            }

            // Show loading, hide result
            loading.style.display = 'block';
            result.style.display = 'none';
            analyzeBtn.disabled = true;

            // Create form data
            const formData = new FormData();
            formData.append('image', file);

            try {
                // Send to Flask API
                const response = await fetch('http://localhost:5000/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Show result
                loading.style.display = 'none';
                result.style.display = 'block';
                resultText.textContent = JSON.stringify(data, null, 2);
                analyzeBtn.disabled = false;

            } catch (error) {
                loading.style.display = 'none';
                result.style.display = 'block';
                resultText.textContent = 'Error: ' + error.message + '\n\nMake sure your Flask server is running on http://localhost:5000';
                analyzeBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
